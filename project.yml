name: MafiaGame
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Set your own team to run on a device; the simulator needs none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  MafiaGame:
    type: application
    platform: iOS
    sources:
      - MafiaGame
    info:
      path: MafiaGame/Info.plist
      properties:
        CFBundleDisplayName: المافيا
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - ReemKufi-Variable.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad apps must allow every orientation (multitasking windows).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mafia
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MafiaGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MafiaGameTests
      # Messages recorded from the online server: the app must keep decoding them.
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MafiaGame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mafia.tests
schemes:
  MafiaGame:
    build:
      targets:
        MafiaGame: all
        MafiaGameTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MafiaGameTests
